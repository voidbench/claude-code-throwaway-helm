{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "claude-code-throwaway.fullname" . }}
  labels:
    {{- include "claude-code-throwaway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: tcp
  selector:
    {{- include "claude-code-throwaway.selectorLabels" . | nindent 4 }}
{{- end }}
