{{- if and .Values.secretEnv.create .Values.secretEnv.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-env" (include "claude-code-throwaway.fullname" .)) .Values.secretEnv.name }}
  labels:
    {{- include "claude-code-throwaway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secretEnv.data | nindent 2 }}
{{- end }}
