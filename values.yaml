image:
  repository: ghcr.io/anthropics/claude-code
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

workspace:
  mountPath: /workspace
  emptyDir: {}

home:
  mountPath: /home/claude
  emptyDir: {}

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

service:
  enabled: false
  type: ClusterIP
  port: 8080

ingress:
  enabled: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

secretEnv:
  create: false
  name: ""
  data: {}

extraEnv: []
extraEnvFrom: []

command:
  - sleep
args:
  - infinity

networkPolicy:
  enabled: true
  allowDns: true
  egressCidrs: []
  egressPorts:
    - 443
    - 80
  extraEgress: []
  ingressEnabled: false
  extraIngress: []

persistence:
  enabled: false
  size: 10Gi
  storageClassName: ""

ttl:
  enabled: false
  secondsAfterFinished: 86400

annotations: {}
podAnnotations: {}

labels: {}
podLabels: {}
